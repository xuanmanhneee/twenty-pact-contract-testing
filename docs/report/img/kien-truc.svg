<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect width="900" height="520" fill="#fff"/>
  <!-- Twenty system -->
  <rect x="20" y="20" width="520" height="480" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="34" y="42" font-weight="bold">Hệ thống được kiểm thử: Twenty v2.46.0 (Docker)</text>
  <rect x="40" y="70" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="95" text-anchor="middle" font-weight="bold">Trình duyệt</text>
  <text x="125" y="114" text-anchor="middle">người dùng CRM</text>
  <rect x="40" y="190" width="170" height="70" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="125" y="216" text-anchor="middle" font-weight="bold">twenty-front</text>
  <text x="125" y="235" text-anchor="middle">React (CONSUMER)</text>
  <rect x="300" y="190" width="220" height="110" rx="8" fill="#fde68a" stroke="#d97706"/>
  <text x="410" y="216" text-anchor="middle" font-weight="bold">twenty-server :3000</text>
  <text x="410" y="236" text-anchor="middle">NestJS (PROVIDER)</text>
  <text x="410" y="256" text-anchor="middle">POST /graphql  (dữ liệu)</text>
  <text x="410" y="274" text-anchor="middle">POST /metadata (người dùng)</text>
  <text x="410" y="292" text-anchor="middle">cookie + kiểm tra Origin/Host</text>
  <rect x="300" y="380" width="100" height="60" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="350" y="406" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="350" y="424" text-anchor="middle">16</text>
  <rect x="420" y="380" width="100" height="60" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="470" y="406" text-anchor="middle" font-weight="bold">Redis</text>
  <text x="470" y="424" text-anchor="middle">cache, hàng đợi</text>
  <rect x="40" y="380" width="200" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="140" y="406" text-anchor="middle" font-weight="bold">twenty-worker</text>
  <text x="140" y="424" text-anchor="middle">ngoài phạm vi kiểm thử</text>
  <line x1="125" y1="130" x2="125" y2="188" stroke="#334155" marker-end="url(#a)"/>
  <line x1="210" y1="225" x2="298" y2="225" stroke="#334155" marker-end="url(#a)"/>
  <text x="254" y="216" text-anchor="middle" font-size="11">GraphQL</text>
  <line x1="350" y1="300" x2="350" y2="378" stroke="#334155" marker-end="url(#a)"/>
  <line x1="470" y1="300" x2="470" y2="378" stroke="#334155" marker-end="url(#a)"/>
  <!-- Pact -->
  <rect x="580" y="20" width="300" height="480" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="594" y="42" font-weight="bold">Bộ kiểm thử Pact (repo nhóm)</text>
  <rect x="600" y="70" width="260" height="60" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="730" y="95" text-anchor="middle" font-weight="bold">consumer.test.js</text>
  <text x="730" y="114" text-anchor="middle">vitest + Pact mock server</text>
  <rect x="600" y="190" width="260" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="730" y="215" text-anchor="middle" font-weight="bold">Hợp đồng (file JSON)</text>
  <text x="730" y="234" text-anchor="middle">pacts/twenty-front-twenty-server.json</text>
  <rect x="600" y="310" width="260" height="70" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="730" y="335" text-anchor="middle" font-weight="bold">provider.verify.test.js</text>
  <text x="730" y="354" text-anchor="middle">Pact Verifier + requestFilter</text>
  <text x="730" y="370" text-anchor="middle" font-size="11">(phiên thật, Origin, Host)</text>
  <rect x="600" y="410" width="260" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="730" y="435" text-anchor="middle" font-weight="bold">auth-proxy :4002, mutate-proxy :4001</text>
  <text x="730" y="454" text-anchor="middle" font-size="11">chỉ dùng cho thí nghiệm phá hợp đồng</text>
  <line x1="730" y1="130" x2="730" y2="188" stroke="#334155" marker-end="url(#a)"/>
  <text x="740" y="164" font-size="11">ghi (pha 1)</text>
  <line x1="730" y1="250" x2="730" y2="308" stroke="#334155" marker-end="url(#a)"/>
  <text x="740" y="284" font-size="11">đọc (pha 2)</text>
  <path d="M600 345 L560 345 L560 245 L522 245" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
  <text x="724" y="303" text-anchor="end" font-size="11" fill="#dc2626">phát lại, so khớp</text>
  <path d="M600 100 L560 100 L560 160 L170 160 L170 188" fill="none" stroke="#2563eb" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="300" y="154" font-size="11" fill="#2563eb">truy vấn lấy từ request thật của twenty-front</text>
</svg>
